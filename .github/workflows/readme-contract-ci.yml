name: Product README Contract CI

on:
  pull_request:
    paths:
      - scripts/product-readme-contract.mjs
      - test/product-readme-contract.test.mjs
      - test/product-readme-workflow.test.mjs
      - .github/workflows/reusable-readme-quality.yml
      - .github/workflows/readme-contract-ci.yml
      - docs/product-readme-contract.md
  push:
    branches: [main]
    paths:
      - scripts/product-readme-contract.mjs
      - test/product-readme-contract.test.mjs
      - test/product-readme-workflow.test.mjs
      - .github/workflows/reusable-readme-quality.yml
      - .github/workflows/readme-contract-ci.yml
      - docs/product-readme-contract.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-contract:
    name: Readme QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run contract and workflow regression tests (no npm dependencies)
        run: node --test test/product-readme-contract.test.mjs test/product-readme-workflow.test.mjs
