name: Deploy AppFactory

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: appfactory-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Deploy AppFactory Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test deployed Worker
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::error::Wrangler did not return a deployment URL."
            exit 1
          fi

          HEALTH_URL="${DEPLOYMENT_URL%/}/health"
          echo "Checking $HEALTH_URL"
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$HEALTH_URL" \
            --output /tmp/appfactory-health.json

          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/appfactory-health.json", "utf8"));
            if (payload.status !== "ok") {
              console.error("Health check failed:", payload);
              process.exit(1);
            }
            console.log("AppFactory health check passed:", payload.service, payload.milestone);
          '
