name: Provision AppFactory Project

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Human-readable project name"
        required: true
        type: string
      slug:
        description: "Repository slug"
        required: true
        type: string
      project_type:
        description: "Project type"
        required: true
        default: mobile
        type: choice
        options:
          - mobile
          - desktop
          - service
          - landing
      private:
        description: "Create a private repository"
        required: true
        default: true
        type: boolean
      description:
        description: "Optional repository description"
        required: false
        type: string
      brief:
        description: "Optional product/site brief"
        required: false
        type: string
      language:
        description: "Content language"
        required: true
        default: en
        type: choice
        options:
          - en
          - fr
  push:
    branches: [main]
    paths:
      - ".appfactory/requests/*.json"

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-${{ github.event_name }}-${{ inputs.slug || github.sha }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      APPFACTORY_URL: https://appfactory-api.lawrynnjennifer.workers.dev
      OIDC_AUDIENCE: appfactory-api

    steps:
      - name: Checkout provisioning requests
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Resolve AppFactory requests
        id: requests
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          requests_file="$RUNNER_TEMP/appfactory-requests.ndjson"
          : > "$requests_file"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            jq -cn \
              --arg name "${{ inputs.name }}" \
              --arg slug "${{ inputs.slug }}" \
              --arg projectType "${{ inputs.project_type }}" \
              --arg description "${{ inputs.description }}" \
              --arg brief "${{ inputs.brief }}" \
              --arg language "${{ inputs.language }}" \
              --argjson private "${{ inputs.private }}" '
                {
                  name: $name,
                  slug: $slug,
                  projectType: $projectType,
                  private: $private,
                  language: $language
                }
                + (if $description != "" then {description: $description} else {} end)
                + (if $brief != "" then {brief: $brief} else {} end)
                + (
                    if $projectType == "mobile" then
                      {platform: "android", preset: "android-compose"}
                    elif $projectType == "desktop" then
                      {platform: "windows", preset: "tauri-react"}
                    elif $projectType == "service" then
                      {preset: "entitlements"}
                    else
                      {}
                    end
                  )
              ' >> "$requests_file"
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              BEFORE_SHA="$(git rev-parse HEAD^)"
            fi

            mapfile -t request_paths < <(
              git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$GITHUB_SHA" -- '.appfactory/requests/*.json'
            )

            if [[ "${#request_paths[@]}" -eq 0 ]]; then
              echo "::error::No added or modified AppFactory request was found."
              exit 1
            fi

            for request_path in "${request_paths[@]}"; do
              jq -e 'type == "object" and (.name | type == "string") and (.slug | type == "string") and (.projectType | type == "string")' "$request_path" >/dev/null
              jq -c . "$request_path" >> "$requests_file"
            done
          fi

          if [[ ! -s "$requests_file" ]]; then
            echo "::error::No AppFactory request payload was produced."
            exit 1
          fi

          echo "path=$requests_file" >> "$GITHUB_OUTPUT"

      - name: Provision through AppFactory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          REQUESTS_FILE: ${{ steps.requests.outputs.path }}
        run: |
          set -euo pipefail

          {
            echo "## AppFactory provisioning"
            echo
            echo "- Authentication: GitHub Actions OIDC"
            printf -- '- Source: `%s`\n' "$GITHUB_EVENT_NAME"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r payload; do
            slug="$(jq -r '.slug // empty' <<<"$payload")"
            requested_type="$(jq -r '.projectType // "landing"' <<<"$payload")"
            if [[ -z "$slug" ]]; then
              echo "::error::Request payload is missing slug."
              exit 1
            fi

            response_file="$(mktemp)"
            http_code="$(
              curl --silent --show-error \
                --output "$response_file" \
                --write-out "%{http_code}" \
                --request POST \
                --header "Content-Type: application/json" \
                --header "Authorization: Bearer $OIDC_TOKEN" \
                --data "$payload" \
                "$APPFACTORY_URL/projects"
            )"

            echo "AppFactory response for $slug:"
            jq . "$response_file"

            if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
              echo "::error::AppFactory returned HTTP $http_code for $slug."
              exit 1
            fi

            repository="$(jq -r '.repository // empty' "$response_file")"
            project_type="$(jq -r '.projectType // "landing"' "$response_file")"
            expected_repository="Trigenys/$slug"

            if [[ "$repository" != "$expected_repository" ]]; then
              echo "::error::Unexpected repository: $repository"
              exit 1
            fi

            if [[ "$project_type" != "$requested_type" ]]; then
              echo "::error::Unexpected project type: $project_type"
              exit 1
            fi

            {
              printf -- '- `%s` — `%s`\n' "$repository" "$project_type"
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$REQUESTS_FILE"
