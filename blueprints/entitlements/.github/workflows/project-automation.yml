name: Project automation

on:
  issues:
    types: [opened, reopened, edited, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional Issue to resync; leave empty to bootstrap"
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-project:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Project automation not configured
        if: env.PROJECT_TOKEN == ''
        run: echo "::notice::PROJECT_TOKEN is not configured; AppFactory Project Automation is skipped until the repository bootstrap secret is added."

      - uses: actions/checkout@v4
        if: env.PROJECT_TOKEN != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: EagleFox31/appfactory-project-automation@v1
        if: env.PROJECT_TOKEN != ''
        with:
          token: ${{ env.PROJECT_TOKEN }}
          config-path: .github/project-config.json
          issue-number: ${{ inputs.issue_number }}
