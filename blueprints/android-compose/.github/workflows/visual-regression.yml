name: Visual regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Detect golden baseline
        id: baseline
        shell: bash
        run: |
          if find app/src/test/screenshots -type f -name '*.png' -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify golden screenshots
        if: steps.baseline.outputs.exists == 'true'
        run: gradle :app:verifyRoborazziDebug

      - name: Record bootstrap candidates
        if: steps.baseline.outputs.exists != 'true'
        run: gradle :app:recordRoborazziDebug

      - name: Upload screenshot candidates
        if: steps.baseline.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-bootstrap-goldens
          path: app/src/test/screenshots/
